            <div className="absolute inset-0 z-[300] flex items-center justify-center p-4 pointer-events-auto ui-element bg-slate-900/80 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 z-10 relative">
                <div className="px-6 py-5 border-b border-slate-100 dark:border-slate-700 bg-indigo-50 dark:bg-indigo-900/30">
                  <h3 className="font-bold text-indigo-900 dark:text-indigo-100 flex items-center gap-2 text-lg"><SettingsIcon size={24} className="text-indigo-600 dark:text-indigo-400"/> 初期設定 (BYOK)</h3>
                  <p className="text-xs text-indigo-700 dark:text-indigo-300 mt-2">このツールを使用するには、ご自身のGAS URLとAPIキーが必要です。これらの情報はブラウザ内にのみ安全に保存されます。</p>
                </div>
                <div className="p-6 flex flex-col gap-4">
                  <div>
                    <p className="text-sm text-slate-700 dark:text-slate-300 font-bold mb-1 flex items-center gap-1"><ServerIcon size={14}/> GAS デプロイURL</p>
                    <input type="text" className="w-full p-3 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white dark:bg-slate-900 dark:text-white" placeholder="https://script.google.com/macros/s/..." defaultValue={gasUrl} onChange={(e) => tempGasUrlRef.current = e.target.value} />
                  </div>
                  <div>
                    <p className="text-sm text-slate-700 dark:text-slate-300 font-bold mb-1 flex items-center gap-1"><Wand2 size={14}/> Gemini API キー</p>
                    <input type="password" className="w-full p-3 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white dark:bg-slate-900 dark:text-white" placeholder="AIzaSy..." defaultValue={apiKey} onChange={(e) => tempApiKeyRef.current = e.target.value} />
                  </div>
                </div>
                <div className="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end bg-slate-50 dark:bg-slate-900">
                  <button type="button" onClick={() => {
                      const newGas = tempGasUrlRef.current?.trim();
                      const newApi = tempApiKeyRef.current?.trim();
                      if (!newGas || !newApi) { setErrorMessage("URLとAPIキーの両方を入力してください。"); return; }
                      setGasUrl(newGas); setApiKey(newApi);
                      localStorage.setItem('mindmap_gas_url', newGas);
                      localStorage.setItem('mindmap_api_key', newApi);
                      setSetupModal(false);
                      setErrorMessage("設定を保存しました。データを読み込みます。");
                    }} 
                    className="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition-colors w-full"
                  >利用を開始する</button>
                </div>
              </div>
            </div>
          )}

          {/* AIモデル・環境設定モーダル */}
          {settingsModal && (
            <div className="absolute inset-0 z-[120] flex items-center justify-center p-4 pointer-events-auto ui-element">
              <div className="absolute inset-0 bg-slate-900/40 dark:bg-slate-900/60 backdrop-blur-sm pointer-events-auto" onClick={() => setSettingsModal(false)}></div>
              <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 z-10 relative max-h-[90vh] overflow-y-auto">
                <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                  <h3 className="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><SettingsIcon size={20} className="text-slate-600 dark:text-slate-400"/> 環境設定</h3>
                  <button type="button" onClick={() => setSettingsModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><X size={20}/></button>
                </div>
                <div className="p-6 flex flex-col gap-4">
                  <div>
                    <p className="text-sm text-slate-700 dark:text-slate-300 font-bold mb-1">GAS デプロイURL</p>
                    <input type="text" className="w-full p-3 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white dark:bg-slate-900 dark:text-white" defaultValue={gasUrl} onChange={(e) => tempGasUrlRef.current = e.target.value} />
                  </div>
                  <div>
                    <p className="text-sm text-slate-700 dark:text-slate-300 font-bold mb-1">Gemini API キー</p>
                    <input type="password" className="w-full p-3 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white dark:bg-slate-900 dark:text-white" defaultValue={apiKey} onChange={(e) => tempApiKeyRef.current = e.target.value} />
                  </div>
                  <div>
                    <p className="text-sm text-slate-700 dark:text-slate-300 font-bold mb-1">Gemini モデル名</p>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">（デフォルト: gemini-3.1-flash-lite-preview）</p>
                    <input type="text" className="w-full p-3 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white dark:bg-slate-900 dark:text-white" defaultValue={modelName} onChange={(e) => tempModelNameRef.current = e.target.value} />
                  </div>
                </div>
                <div className="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3 bg-slate-50 dark:bg-slate-900">
                  <button type="button" onClick={() => setSettingsModal(false)} className="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">キャンセル</button>
                  <button type="button" onClick={() => {
                      const newGas = tempGasUrlRef.current?.trim() || gasUrl;
                      const newApi = tempApiKeyRef.current?.trim() || apiKey;
                      const mName = tempModelNameRef.current?.trim() || 'gemini-3.1-flash-lite-preview';
                      setGasUrl(newGas); setApiKey(newApi); setModelName(mName);
                      localStorage.setItem('mindmap_gas_url', newGas);
                      localStorage.setItem('mindmap_api_key', newApi);
                      localStorage.setItem('gemini_model_name', mName);
                      setSettingsModal(false); setErrorMessage("設定を保存しました。");
                      if(newGas !== gasUrl) window.location.reload(); 
                    }} 
                    className="px-5 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors"
                  >設定を保存する</button>
                </div>
              </div>
            </div>
          )}

          
          {/* テキスト出力モーダル */}
          {exportTextModal && (
            <div className="absolute inset-0 z-[120] flex items-center justify-center p-2 sm:p-4 pointer-events-auto ui-element">
              <div className="absolute inset-0 bg-slate-900/40 dark:bg-slate-900/60 backdrop-blur-sm pointer-events-auto" onClick={() => setExportTextModal(false)}></div>
              <div className="bg-white dark:bg-slate-800 w-full max-w-[95vw] h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 z-10 relative">
                <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                  <h3 className="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><ClipboardList size={20} className="text-slate-600 dark:text-slate-400"/> 構造をテキスト化</h3>
                  <button type="button" onClick={() => setExportTextModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><X size={20}/></button>
                </div>
                <div className="p-4 sm:p-6 flex-1 flex flex-col min-h-0">
                  <p className="text-sm text-slate-600 dark:text-slate-400 mb-3">現在の{isFocusActive ? 'フォーカス対象' : 'マインドマップ'}の階層構造です。端で自動折り返しされるようになりました。</p>
                  <textarea 
                    readOnly 
                    value={exportedText} 
                    className="w-full flex-1 p-4 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50 dark:bg-slate-900 dark:text-slate-100 font-mono whitespace-pre-wrap overflow-y-auto" 
                  />
                </div>
                <div className="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3 bg-slate-50 dark:bg-slate-900">
                  <button type="button" onClick={() => setExportTextModal(false)} className="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">閉じる</button>
                  <button type="button" onClick={() => { navigator.clipboard?.writeText(exportedText).catch(()=>{}); setCopied(true); setTimeout(()=>setCopied(false), 2000); }} 
                    className="px-5 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors flex items-center gap-2"
                  >
                    {copied ? <Check size={16}/> : <Copy size={16}/>} {copied ? 'コピーしました' : 'コピーして閉じる'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* テキストから生成モーダル */}
          {textInputModal && (
            <div className="absolute inset-0 z-[110] flex items-center justify-center p-4 pointer-events-auto ui-element">
              <div className="absolute inset-0 bg-slate-900/40 dark:bg-slate-900/60 backdrop-blur-sm pointer-events-auto" onClick={() => setTextInputModal(false)}></div>
              <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 z-10 relative">
                <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                  <h3 className="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><TextSelect size={20} className="text-purple-600 dark:text-purple-400"/> テキストからマップ生成</h3>
                  <button type="button" onClick={() => setTextInputModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><X size={20}/></button>
                </div>
                <div className="p-6">
                  <p className="text-sm text-slate-600 dark:text-slate-400 mb-3">会議の議事録や長文を貼り付けてください。AIが階層構造を読み取り一瞬でマインドマップに変換します。</p>
                  <textarea value={inputText} onChange={(e)=>setInputText(e.target.value)} className="w-full h-48 p-4 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-purple-500 resize-none text-sm bg-slate-50 dark:bg-slate-900 dark:text-slate-100" placeholder="ここにテキストを入力..." autoFocus />
                </div>
                <div className="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3 bg-slate-50 dark:bg-slate-900">
                  <button type="button" onClick={() => setTextInputModal(false)} className="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">キャンセル</button>
                  <button type="button" onClick={generateFromText} disabled={!inputText.trim()} className="px-5 py-2 text-sm font-bold text-white bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg shadow-sm transition-colors flex items-center gap-2"><Sparkles size={16}/> 生成する</button>
                </div>
              </div>
            </div>
          )}

          {/* 結果表示モーダル */}
          {aiModal.isOpen && (
            <div className="absolute inset-0 z-[110] flex items-center justify-center p-4 sm:p-8 pointer-events-auto ui-element">
              <div className="absolute inset-0 bg-slate-900/40 dark:bg-slate-900/60 backdrop-blur-sm pointer-events-auto" onClick={() => setAiModal({isOpen:false})}></div>
              <div className="bg-white dark:bg-slate-800 w-full max-w-3xl max-h-full rounded-2xl shadow-2xl flex flex-col animate-in zoom-in-95 z-10 relative">
                <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-indigo-50/50 dark:bg-indigo-900/30 rounded-t-2xl">
                  <h3 className="font-bold text-indigo-900 dark:text-indigo-100 text-lg">{aiModal.title}</h3>
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => { document.execCommand('copy'); navigator.clipboard?.writeText(aiModal.content).catch(()=>{}); setCopied(true); setTimeout(()=>setCopied(false), 2000); }} className="p-2 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 rounded-lg transition-colors flex items-center gap-1 text-sm font-medium">
                      {copied ? <Check size={18}/> : <Copy size={18}/>} {copied ? 'コピーしました' : 'コピー'}
                    </button>
                    <button type="button" onClick={() => setAiModal({isOpen:false})} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg"><X size={24}/></button>
                  </div>
                </div>
                <div className="p-6 overflow-y-auto" style={{ maxHeight: '70vh' }}>
                  <div className="prose prose-sm sm:prose-base max-w-none prose-indigo prose-headings:font-bold prose-a:text-indigo-600 dark:prose-a:text-indigo-400 dark:prose-invert">
                    <pre className="whitespace-pre-wrap font-sans text-slate-700 dark:text-slate-300 bg-transparent p-0 m-0 border-none text-base leading-relaxed">
                      {aiModal.content.split('\n').map((line, i) => {
                        if (line.startsWith('# ')) return <h1 key={i} className="text-2xl font-extrabold mt-6 mb-4 text-slate-900 dark:text-slate-100 border-b dark:border-slate-700 pb-2">{line.substring(2)}</h1>;
                        if (line.startsWith('## ')) return <h2 key={i} className="text-xl font-bold mt-5 mb-3 text-slate-800 dark:text-slate-200">{line.substring(3)}</h2>;
                        if (line.startsWith('### ')) return <h3 key={i} className="text-lg font-bold mt-4 mb-2 text-slate-800 dark:text-slate-200">{line.substring(4)}</h3>;
                        if (line.startsWith('- [ ] ')) return <div key={i} className="flex items-start gap-2 my-2"><div className="w-5 h-5 mt-0.5 border-2 border-slate-300 dark:border-slate-600 rounded flex-shrink-0"></div><span>{line.substring(6).replace(/\*\*(.*?)\*\*/g, '$1')}</span></div>;
                        if (line.startsWith('- ')) return <div key={i} className="flex items-start gap-2 my-1"><div className="w-1.5 h-1.5 mt-2 rounded-full bg-slate-400 dark:bg-slate-500 flex-shrink-0"></div><span>{line.substring(2).replace(/\*\*(.*?)\*\*/g, '$1')}</span></div>;
                        const formattedLine = line.split(/(\*\*.*?\*\*)/).map((part, j) => {
                          if (part.startsWith('**') && part.endsWith('**')) return <strong key={j} className="font-bold text-slate-900 dark:text-slate-100">{part.slice(2, -2)}</strong>;
                          return part;
                        });
                        return <p key={i} className="my-2 min-h-[1em]">{formattedLine}</p>;
                      })}
                    </pre>
                  </div>
                </div>
                <div className="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end bg-slate-50 dark:bg-slate-900 rounded-b-2xl">
                  <button type="button" onClick={() => setAiModal({isOpen:false})} className="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition-colors">閉じる</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
